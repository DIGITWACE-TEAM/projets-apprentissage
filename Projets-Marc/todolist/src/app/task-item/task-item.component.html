<div class="task-item" [class.done-view]="viewType === 'done'" [class.completed]="task.completed">
  <input 
    type="checkbox" 
    [checked]="task.completed" 
    (change)="toggle.emit(task.id)"
  >
  <div class="task-content">
    <span *ngIf="!isEditing" class="task-text">{{ task.text }}</span>
    <input *ngIf="isEditing" [(ngModel)]="editedText">
    <span class="task-date">{{ task.date | date:'dd/MM/yyyy HH:mm' }}</span>
  </div>  
  <div class="actions">
    <button *ngIf="!isEditing" (click)="startEdit()">Renommer</button>
    <button *ngIf="isEditing" (click)="saveEdit()">Sauvegarder</button>
    <button (click)="delete.emit(task.id)">Supprimer</button>
  </div>
</div>
